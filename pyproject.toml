[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frames_dashboard"
version = "1.0.0"
description = "Web dashboard showing the latest capture from each RMS station"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ContrailCast"}]
keywords = ["rms", "meteor", "dashboard", "frames"]
requires-python = ">=3.10"
dependencies = ["Pillow>=9"]

[project.scripts]
frames-dashboard = "frames_dashboard.__main__:main"

[tool.setuptools]
packages = ["frames_dashboard"]

[tool.setuptools.package-data]
frames_dashboard = ["static/*"]
